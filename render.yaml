services:
  - type: web
    name: carta-sorpresa
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts && npm run build
    startCommand: npm run start -- --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://carta-sorpresa.onrender.com
